# CodSpeed performance benchmarks.
#
# Two tracks × two modes:
# 1. tinybench micro-benchmarks — run INSIDE the CodSpeed action via `run:`
#    so per-bench.add() metrics are reported individually.
# 2. CLI exec: benchmarks (boot) — discovered from codspeed.yml by the action.
#
# Modes:
#   walltime   — wall-clock sampling; required for Bun/JavaScriptCore since
#                CodSpeed's CPU-simulation instrument is V8-only.
#   simulation — CPU simulation; expected to no-op on Bun but tried anyway
#                (continue-on-error) so we notice if CodSpeed adds JSC support.
#
# Caching: Bun store + Rust target/ + sccache mirror the setup in
# .github/actions/build-native so PRs restore from main's warm cache.
# save-if restricts writes to main pushes so PR runs don't pollute the cache.

name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Track 1: per-function micro-benchmarks via tinybench.
  # The `run:` input wraps the bench command with CodSpeed instrumentation
  # so per-bench.add() metrics are reported individually.
  micro-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [walltime, simulation]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed-native-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/**') }}
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: bun run build:native
      - uses: CodSpeedHQ/action@v4
        continue-on-error: ${{ matrix.mode == 'simulation' }}
        with:
          mode: ${{ matrix.mode }}
          run: bun run bench:codspeed
        env:
          CODSPEED_WALLTIME_PROFILER: samply

  # Track 2: whole-process wall-clock benchmarks (boot) via codspeed.yml exec:.
  # The action discovers codspeed.yml at repo root and runs each exec: entry.
  # No `run:` input — the action reads the config file instead.
  cli-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [walltime, simulation]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed-native-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/**') }}
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: bun run build:native
      - uses: CodSpeedHQ/action@v4
        continue-on-error: ${{ matrix.mode == 'simulation' }}
        with:
          mode: ${{ matrix.mode }}
        env:
          CODSPEED_WALLTIME_PROFILER: samply
